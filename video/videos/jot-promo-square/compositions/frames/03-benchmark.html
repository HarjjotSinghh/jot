<script>
(function () {
  window.__timelines = window.__timelines || {};

  var tl = gsap.timeline({ paused: true });

  /* Scene 1 (0.0-1.8s): method line types in at top, small mono, dim. */
  tl.fromTo(
    "#bench-method-text",
    { clipPath: "inset(0 100% 0 0)" },
    { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "none" },
    0.06
  );

  /* Scene 2 (1.8-3.0s): table frame draws on - two hairline rules, three
     empty rows (svg-path-draw, 700ms each). Row labels fade in at left. */
  var divider1 = document.getElementById("bench-div-1");
  var divider2 = document.getElementById("bench-div-2");
  var div1Len = divider1.getTotalLength();
  var div2Len = divider2.getTotalLength();
  divider1.style.strokeDasharray = div1Len;
  divider1.style.strokeDashoffset = div1Len;
  divider2.style.strokeDasharray = div2Len;
  divider2.style.strokeDashoffset = div2Len;

  tl.to(divider1, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 1.08);
  tl.to(divider2, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 1.38);

  var rowStarts = [1.14, 1.23, 1.32];
  for (var i = 1; i <= 3; i++) {
    var at = rowStarts[i - 1];
    tl.fromTo(
      "#bench-label-" + i,
      { opacity: 0, x: -18 },
      { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
      at
    );
    tl.fromTo(
      "#bench-track-" + i,
      { opacity: 0, x: -18 },
      { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
      at
    );
  }

  /* Shared row-resolve beat: count-up + transform-scale growth
     (counting-dynamic-scale) paired with a bar fill on the same ease/
     duration (stat-bars-and-fills), a suffix settle, and the label
     darkening from secondary to ink as its row becomes the active one. */
  function resolveRow(index, target, pct, start) {
    var counter = document.getElementById("bench-num-" + index);
    var fill = document.getElementById("bench-fill-" + index);
    var suffix = document.getElementById("bench-suffix-" + index);
    var label = document.getElementById("bench-label-" + index);
    var countDur = 1.2;
    var countEase = "power2.out";
    var startScale = 0.5;

    /* Direct innerText tween (counting-dynamic-scale "no proxy" variation):
       GSAP writes the rounded digits itself on every render, including a
       hard seek, so the count-up is correct even when the renderer jumps
       straight to a timestamp instead of playing frames in order. */
    tl.fromTo(
      counter,
      { innerText: 0 },
      { innerText: target, duration: countDur, ease: countEase, snap: { innerText: 1 } },
      start
    );

    tl.fromTo(
      counter,
      { scale: startScale, opacity: 0 },
      { scale: 1, opacity: 1, duration: countDur, ease: countEase },
      start
    );

    tl.fromTo(
      fill,
      { scaleX: 0 },
      { scaleX: pct, duration: countDur, ease: countEase },
      start
    );

    tl.to(
      label,
      { color: "#1A1A1A", duration: countDur, ease: countEase },
      start
    );

    tl.fromTo(
      suffix,
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.24, ease: "back.out(1.6)" },
      start + countDur
    );
  }

  /* Scene 3 (3.0-4.6s): row 1 resolves - 0 to 7, bar to 35%. */
  resolveRow(1, 7, 0.35, 1.8);
  /* Scene 4 (4.6-6.2s): row 2 resolves - 0 to 13, bar to 65%. */
  resolveRow(2, 13, 0.65, 2.76);
  /* Scene 5 (6.2-8.0s): row 3 resolves - 0 to 18, bar to 90%, cobalt fill. */
  resolveRow(3, 18, 0.9, 3.72);

  /* Scene 6 (8.0-10.0s): held. No camera, no further motion of any kind -
     the three numbers simply read as a column through the final 2 seconds. */

  window.__timelines["03-benchmark"] = tl;
})();
</script>
