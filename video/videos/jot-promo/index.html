<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAFAFA;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-the-tax"
        class="scene"
        data-composition-id="01-the-tax"
        data-composition-src="compositions/frames/01-the-tax.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-the-logs"
        class="scene"
        data-composition-id="02-the-logs"
        data-composition-src="compositions/frames/02-the-logs.html"
        data-start="4.5"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-one-rule"
        class="scene"
        data-composition-id="03-one-rule"
        data-composition-src="compositions/frames/03-one-rule.html"
        data-start="11.5"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-benchmark"
        class="scene"
        data-composition-id="04-benchmark"
        data-composition-src="compositions/frames/04-benchmark.html"
        data-start="19.5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-provenance"
        class="scene"
        data-composition-id="05-provenance"
        data-composition-src="compositions/frames/05-provenance.html"
        data-start="25.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-the-tax", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.fromTo("#el-02-the-logs", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.to("#el-02-the-logs", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.5);
        tl.fromTo("#el-03-one-rule", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11.5);
        tl.to("#el-03-one-rule", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19.5);
        tl.fromTo("#el-04-benchmark", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19.5);
        tl.to("#el-04-benchmark", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-05-provenance", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.to({}, { duration: 31 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
