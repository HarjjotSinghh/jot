<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    window.__timelines = window.__timelines || {};

    var cmdEl = document.getElementById("logs02-cmd");
    var caretEl = document.getElementById("logs02-caret");
    var scanRowsWrap = document.getElementById("logs02-scanrows");
    var rankRowsWrap = document.getElementById("logs02-rankrows");
    var ruleEl = document.getElementById("logs02-rule");
    var totalNumEl = document.getElementById("logs02-totalnum");
    var totalLabelEl = document.getElementById("logs02-totallabel");

    var scanRows = scanRowsWrap.querySelectorAll(".logs02-scanrow");
    var rankRows = rankRowsWrap.querySelectorAll(".logs02-rankrow");

    // ---- deterministic "human jitter" typing schedule (no Math.random) ----
    var CMD = "python scripts/extract_corpus.py";
    var JITTER = [0.0242, 0.035, 0.0286, 0.0395, 0.0255, 0.0318, 0.0369, 0.0229];
    var TYPE_START = 0.7636;
    var charTimes = [];
    (function buildCharTimes() {
      var acc = 0;
      for (var i = 0; i < CMD.length; i++) {
        acc += JITTER[i % JITTER.length];
        charTimes.push(TYPE_START + acc);
      }
    })();
    var TYPE_END = charTimes[charTimes.length - 1];
    var RETURN_T = TYPE_END + 0.35;
    var BLINK_PERIOD = 0.6;
    var TYPING_GRACE = 0.0955;

    function charCountAt(t) {
      var n = 0;
      for (var i = 0; i < charTimes.length; i++) {
        if (t >= charTimes[i]) n++;
      }
      return n;
    }
    function isTypingAt(t) {
      for (var i = 0; i < charTimes.length; i++) {
        if (t >= charTimes[i] && t - charTimes[i] < TYPING_GRACE) return true;
      }
      return false;
    }

    var tl = gsap.timeline({ paused: true });

    // Single deterministic clock driving typed text + caret across the whole shot.
    var clock = { t: 0 };
    tl.to(
      clock,
      {
        t: 7,
        duration: 7,
        ease: "none",
        onUpdate: function () {
          var t = clock.t;
          cmdEl.textContent = CMD.substring(0, charCountAt(t));
          if (t >= RETURN_T) {
            caretEl.style.opacity = "0";
          } else {
            var typing = isTypingAt(t);
            var blinkOn = Math.sin(t * ((Math.PI * 2) / BLINK_PERIOD)) > 0;
            caretEl.style.opacity = typing || blinkOn ? "1" : "0";
          }
        },
      },
      0,
    );

    // Scene 1 (0.0-1.2s): terminal window springs up, centred, hero visible well before t=0.5s.
    tl.fromTo(
      "#logs02-card",
      { scale: 0.96, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.2864, ease: "power3.out" },
      0,
    );

    // Scene 3 (3.2-5.6s): five store paths whip in from below, one per 240ms (waterfall-entry).
    var SCAN_START = 2.0364;
    var SCAN_STAGGER = 0.1527;
    scanRows.forEach(function (row, i) {
      var t0 = SCAN_START + i * SCAN_STAGGER;
      tl.set(row, { opacity: 1, y: 44 }, t0);
      tl.to(row, { y: 0, duration: 0.0955, ease: "power4.out" }, t0);
    });

    // Scene 4 (5.6-8.4s): rows resolve into a ranked, right-aligned count column (counting-dynamic-scale).
    var RANK_START = 3.5636;
    var RANK_STAGGER = 0.0764;
    var COUNT_DUR = 0.9545;
    var TARGETS = [1048, 209, 110, 17, 14];

    tl.to(".logs02-scanrow", { opacity: 0, duration: 0.14, ease: "power1.out" }, RANK_START);

    rankRows.forEach(function (row, i) {
      var t0 = RANK_START + i * RANK_STAGGER;
      var countEl = row.querySelector(".logs02-rankcount");
      var state = { v: 0 };
      var startScale = 0.55;

      tl.fromTo(
        row,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.2545, ease: "power3.out" },
        t0,
      );
      tl.to(
        state,
        {
          v: TARGETS[i],
          duration: COUNT_DUR,
          ease: "power2.out",
          onUpdate: function () {
            countEl.textContent = Math.round(state.v).toLocaleString();
          },
        },
        t0,
      );
      tl.fromTo(
        countEl,
        { scale: startScale },
        { scale: 1, duration: COUNT_DUR, ease: "power2.out" },
        t0,
      );
    });

    // Scene 5 (8.4-11.0s): rule draws on, grand total counts up - the one cobalt moment. Then holds.
    var SCENE5_START = 5.3455;
    tl.fromTo(ruleEl, { scaleX: 0 }, { scaleX: 1, duration: 0.1909, ease: "power2.out" }, SCENE5_START);

    var TOTAL_TARGET = 1398;
    var TOTAL_COUNT_START = SCENE5_START + 0.1909;
    var TOTAL_COUNT_DUR = 0.4455;
    var totalState = { v: 0 };
    tl.to(
      totalState,
      {
        v: TOTAL_TARGET,
        duration: TOTAL_COUNT_DUR,
        ease: "expo.out",
        onUpdate: function () {
          totalNumEl.textContent = Math.round(totalState.v).toLocaleString();
        },
      },
      TOTAL_COUNT_START,
    );
    tl.fromTo(
      totalNumEl,
      { scale: 0.6 },
      { scale: 1, duration: TOTAL_COUNT_DUR, ease: "expo.out" },
      TOTAL_COUNT_START,
    );
    tl.fromTo(
      totalLabelEl,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.2227, ease: "power2.out" },
      TOTAL_COUNT_START + TOTAL_COUNT_DUR,
    );

    window.__timelines["02-the-logs"] = tl;
  })();
</script>
